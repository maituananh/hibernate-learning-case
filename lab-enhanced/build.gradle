plugins {
	id 'java'
	// Cùng version với Hibernate mà Spring Boot quản lý (7.4.15.Final): plugin enhance bytecode bằng đúng bản Hibernate đó.
	// Plugin này CHỈ được khai ở đây, không khai ở project gốc (xem settings.gradle).
	id 'org.hibernate.orm' version '7.4.15.Final'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// Hạ tầng test dùng chung của project gốc (SqlCaptor, DbReader, SchemaInspector, Postgres container, ...).
	testImplementation testFixtures(project(':'))
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Subproject này chỉ là thư viện + test, không chạy như ứng dụng: tắt bootJar (không có main class để đóng gói).
bootJar {
	enabled = false
}
jar {
	enabled = true
}

// ─────────────────────────────────────────────────────────────────────────
// Bytecode enhancement: Hibernate sửa file .class của entity SAU KHI biên dịch (không đổi source Java).
// Chỉ áp cho source set `main` của subproject này. Entity đối chứng (không enhance) nằm ở src/test/java.
// ─────────────────────────────────────────────────────────────────────────
hibernate {
	enhancement {
		// Cho phép lazy loading ở mức thuộc tính (@Basic(fetch = LAZY)) và to-one inverse không proxy (G13-S11, S12).
		enableLazyInitialization = true
		// Entity tự ghi nhận field nào đã đổi thay vì Hibernate so từng field với snapshot lúc load (G13-S13).
		enableDirtyTracking = true
		// Tự đồng bộ hai chiều của quan hệ (customer.setCard ⇒ card.setCustomer). Cố ý TẮT để không che hành vi mapping.
		enableAssociationManagement = false
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// Cùng lý do với project gốc (D15): Gradle mặc định giấu stdout nên sẽ không thấy SQL.
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}
